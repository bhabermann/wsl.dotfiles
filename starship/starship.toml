# Two-line, colorful prompt (JetBrains Mono Nerd Font glyphs).
# Line 1: folder icon + path + git branch/status + language versions
# Line 2: prompt character
add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$java\
$dotnet\
$golang\
$rust\
$docker_context\
$line_break\
$character"""

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

[directory]
format = "[ ]($style)[$path]($style)[$read_only]($read_only_style) "
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"
read_only_style = "bold red"
home_symbol = "~"
style = "bold cyan"

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold purple"

[git_status]
disabled = false
style = "bold red"
format = '([$all_status$ahead_behind]($style)) '
conflicted = "[ ${count}](bold yellow)"
ahead = "[⇡${count}](bold green)"
behind = "[⇣${count}](bold green)"
diverged = "[⇕⇡${ahead_count}⇣${behind_count}](bold yellow)"
untracked = "[?${count}](bold blue)"
stashed = "[ ${count}](bold cyan)"
modified = "[!${count}](bold yellow)"
staged = "[+${count}](bold green)"
renamed = "[»${count}](bold purple)"
deleted = "[✘${count}](bold red)"

[nodejs]
symbol = " "
format = "[$symbol($version )]($style)"
style = "bold green"

[python]
symbol = " "
format = "[$symbol($version )]($style)"
style = "bold yellow"

[java]
symbol = " "
format = "[$symbol($version )]($style)"
style = "bold red"

[dotnet]
symbol = " "
format = "[$symbol($version )]($style)"
style = "bold blue"
heuristic = false
detect_extensions = ["cs", "csproj", "fsproj", "xproj", "sln", "slnx"]

[golang]
symbol = " "
format = "[$symbol($version )]($style)"
style = "bold cyan"

[rust]
symbol = "󱘗 "
format = "[$symbol($version )]($style)"
style = "bold red"

[docker_context]
symbol = " "
format = "[$symbol$context]($style) "
style = "bold blue"
only_with_files = true

# Ubuntu / OS indicator (off by default in prompt)
[os]
disabled = true
[os.symbols]
Ubuntu = " "
Debian = " "
Windows = " "
Macos = " "
Linux = " "
