add_newline = false
command_timeout = 300
scan_timeout = 20
format = "$directory$git_branch$git_status$cmd_duration$line_break$character"
palette = "mocha"
[directory]
style = "bold lavender"
truncation_length = 4
[git_branch]
symbol = " "
style = "mauve"
[git_status]
style = "peach"
[cmd_duration]
min_time = 2000
style = "yellow"
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
[palettes.mocha]
lavender = "#b4befe"
mauve = "#cba6f7"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
red = "#f38ba8"
