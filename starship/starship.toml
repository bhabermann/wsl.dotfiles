add_newline = false

# Fast scanning: icon + space, consistent colors per language
format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$java\
$dotnet\
$golang\
$rust\
$docker_context\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

[directory]
truncation_length = 4
truncate_to_repo = false
read_only = " "
home_symbol = " ~"
style = "bold cyan"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
disabled = false
style = "bold red"
conflicted = "✖"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = " ${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[nodejs]
symbol = " "
style = "bold green"

[python]
symbol = " "
style = "bold yellow"

[java]
symbol = " "
style = "bold red"

[dotnet]
symbol = " "
style = "bold blue"

[golang]
symbol = " "
style = "bold cyan"

[rust]
symbol = " "
style = "bold red"

[docker_context]
symbol = " "
style = "bold blue"
only_with_files = true

# Ubuntu / OS indicator (shown only when you want it; off by default in prompt)
[os]
disabled = true
[os.symbols]
Ubuntu = " "
Debian = " "
Windows = " "
Macos = " "
Linux = " "
